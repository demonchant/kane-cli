name: PatchLoop checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose --profile test config --quiet
      - run: docker compose --profile test build patchloop-test demo-test e2e
      - run: docker compose --profile test up --build --abort-on-container-exit --exit-code-from e2e e2e
      - if: always()
        run: docker compose --profile test down
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patchloop-playwright-report
          path: artifacts/playwright/
          if-no-files-found: ignore
