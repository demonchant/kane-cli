<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Goodwork — tasks</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><main class="app"><header><a class="brand" href="/" aria-label="Showcase home"><span>p.</span> patchloop showcase</a><span class="local"><i></i> PRIVATE WORKSPACE</span></header><section class="intro"><p class="eyebrow">YOUR DAY, IN FOCUS</p><h1>Make room<br>for <em>good work.</em></h1><p class="sub">A small list for the things that matter.</p></section><section class="tasks" aria-label="Tasks"><div class="task-tabs"><button class="tab active" data-view="active">Active <span id="active-count">0</span></button><button class="tab" data-view="archived">Archived <span id="archived-count">0</span></button></div><form id="task-form"><label class="sr-only" for="task-title">New task</label><input id="task-title" maxlength="180" placeholder="Add a task worth finishing…" autocomplete="off" required><button aria-label="Add task" type="submit">+</button></form><p id="message" role="status" aria-live="polite"></p><ul id="task-list"></ul></section><footer><span>GOODWORK / LOCAL TASKS</span><span>Changes are saved on this machine.</span></footer></main></body></html>
